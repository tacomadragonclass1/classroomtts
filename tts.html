<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom TTS</title>
<style>
  :root{
    --bg:#E8EDF0; --surface:#FFFFFF; --ink:#101A21; --muted:#63747F;
    --rule:#C9D5DC; --live:#0B6E4F; --off:#A32B32; --accent:#1F4E96;
    --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  h1{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:0 0 4px}
  .sub{margin:0;color:var(--muted);max-width:62ch}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}

  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
  textarea,select,input[type=text]{
    width:100%;font-family:var(--sans);font-size:17px;padding:11px 12px;
    border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:2px;
  }
  textarea{height:110px;resize:vertical}
  input[type=range]{width:100%}
  button{
    font-family:var(--sans);font-size:15px;font-weight:600;padding:11px 20px;
    border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:2px;cursor:pointer;
  }
  button.ghost{background:transparent;color:var(--ink)}
  button.small{font-size:12px;padding:6px 11px}
  button:hover{opacity:.86}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button[disabled]{opacity:.35;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}

  .status{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{
    font-family:var(--mono);font-size:12px;padding:5px 10px;border:1px solid var(--rule);
    background:var(--surface);border-left:4px solid var(--muted);
  }
  .chip[data-live="1"]{border-left-color:var(--live);color:var(--live)}
  .chip[data-live="0"]{border-left-color:var(--off);color:var(--off)}

  .hist{margin-top:22px;border-top:1px solid var(--rule);padding-top:8px}
  .hist .item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
  .hist .txt{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .link-out{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--rule);padding:9px 10px;word-break:break-all;margin-bottom:4px}

  /* Receiver */
  body.recv{background:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
  .arm{width:100%;height:100vh;border:0;background:var(--accent);color:#fff;font-size:6vw;font-weight:700;letter-spacing:-.02em;cursor:pointer}
  .stage{display:none;width:100%;height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:4vw;gap:3vh}
  .stage.on{display:flex}
  .spoken{font-size:clamp(36px,8.5vw,150px);font-weight:650;letter-spacing:-.03em;line-height:1.08;max-width:95vw}
  .idle{color:var(--muted);font-family:var(--mono);font-size:14px;letter-spacing:.16em;text-transform:uppercase}
  .badge{position:fixed;top:12px;left:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .badge b{color:var(--live)}
  .badge.down b{color:var(--off)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script src="mqtt.min.js"></script>
<script>
const P = new URLSearchParams(location.search);
const ROOM = P.get("room") || "";
const ROLE = P.get("mode") === "send" ? "send" : (P.get("id") ? "recv" : "setup");
const MY_ID = P.get("id") || "";
const BROKERS = {
  hivemq: "wss://broker.hivemq.com:8884/mqtt",
  emqx:   "wss://broker.emqx.io:8084/mqtt"
};
const BROKER = BROKERS[P.get("broker")] || BROKERS.hivemq;
const SCREENS = ["screen1","screen2"];
const app = document.getElementById("app");
const T = {
  say:  r => `ctts/${r}/say`,
  stop: r => `ctts/${r}/stop`,
  pres: (r,id) => `ctts/${r}/presence/${id}`,
  presAll: r => `ctts/${r}/presence/+`
};

/* ---------------- shared ---------------- */
function connect(opts){
  return mqtt.connect(BROKER, Object.assign({
    clientId: "ctts_" + Math.random().toString(16).slice(2,10),
    clean: true,
    reconnectPeriod: 2000,
    connectTimeout: 8000
  }, opts));
}

function voiceList(){
  const v = speechSynthesis.getVoices();
  // Edge natural voices first, then local, then everything else
  const score = x => (/Natural/.test(x.name) ? 0 : x.localService ? 1 : 2);
  return v.filter(x => x.lang.startsWith("en") || x.lang.startsWith("es"))
          .sort((a,b) => score(a) - score(b) || a.name.localeCompare(b.name));
}

/* ---------------- setup screen ---------------- */
function renderSetup(){
  const room = ROOM || (Math.random().toString(36).slice(2,6) + Math.random().toString(36).slice(2,6));
  const base = location.origin + location.pathname;
  app.innerHTML = `
    <div class="wrap">
      <header>
        <p class="eyebrow">Classroom TTS</p>
        <h1>Room links</h1>
        <p class="sub">Bookmark all three. Open the screen links on the classroom laptops in Microsoft Edge, and the teacher link on your laptop.</p>
      </header>
      <label>Room code</label>
      <input type="text" id="roomin" value="${room}">
      <p class="sub" style="margin-top:6px;font-size:13px">Anyone with this code can send audio to your screens, so keep it random and don't post it anywhere.</p>
      <div id="links"></div>
      <div class="row" style="margin-top:20px">
        <button id="go">Open teacher page</button>
      </div>
    </div>`;

  const draw = () => {
    const r = document.getElementById("roomin").value.trim();
    document.getElementById("links").innerHTML =
      `<label>Teacher laptop</label><div class="link-out">${base}?room=${r}&mode=send</div>` +
      SCREENS.map((s,i) =>
        `<label>Classroom screen ${i+1}</label><div class="link-out">${base}?room=${r}&id=${s}</div>`
      ).join("");
  };
  draw();
  document.getElementById("roomin").addEventListener("input", draw);
  document.getElementById("go").addEventListener("click", () => {
    location.search = "?room=" + document.getElementById("roomin").value.trim() + "&mode=send";
  });
}

/* ---------------- teacher / sender ---------------- */
function renderSender(){
  app.innerHTML = `
    <div class="wrap">
      <header>
        <p class="eyebrow">Room ${ROOM} · teacher</p>
        <h1>Send to the screens</h1>
        <p class="sub">This page never plays audio. It tells the classroom laptops what to say.</p>
        <div class="status" id="status"></div>
      </header>

      <label for="text">Text to speak</label>
      <textarea id="text" placeholder="Type here, then press Send. Ctrl+Enter also sends."></textarea>

      <div class="grid2">
        <div>
          <label for="target">Send to</label>
          <select id="target">
            <option value="all">Both screens</option>
            <option value="screen1">Screen 1 only</option>
            <option value="screen2">Screen 2 only</option>
          </select>
        </div>
        <div>
          <label for="voice">Voice</label>
          <select id="voice"></select>
        </div>
      </div>

      <label for="rate">Speed — <span id="ratev">0.9</span>x</label>
      <input type="range" id="rate" min="0.5" max="1.4" step="0.05" value="0.9">

      <div class="row" style="margin-top:22px">
        <button id="send">Send</button>
        <button id="stop" class="ghost">Stop all</button>
      </div>

      <div class="hist"><label>Recent — click to repeat</label><div id="hist"></div></div>
    </div>`;

  const $ = id => document.getElementById(id);
  const statusEl = $("status");
  const presence = {};

  const drawStatus = (conn) => {
    statusEl.innerHTML =
      `<span class="chip" data-live="${conn?1:0}">broker ${conn?"connected":"offline"}</span>` +
      SCREENS.map((s,i) => {
        const live = presence[s] === "online";
        return `<span class="chip" data-live="${live?1:0}">screen ${i+1} ${live?"live":"not open"}</span>`;
      }).join("");
  };
  drawStatus(false);

  const fillVoices = () => {
    const list = voiceList();
    if(!list.length) return;
    const pref = localStorage.getItem("ctts_voice");
    $("voice").innerHTML = list.map(v =>
      `<option value="${v.name.replace(/"/g,"&quot;")}">${v.name.replace(/Microsoft |Online \(Natural\) /g,"")} — ${v.lang}</option>`
    ).join("");
    if(pref && list.some(v => v.name === pref)) $("voice").value = pref;
  };
  fillVoices();
  speechSynthesis.onvoiceschanged = fillVoices;

  const client = connect({});
  client.on("connect", () => {
    drawStatus(true);
    client.subscribe(T.presAll(ROOM));
  });
  client.on("close", () => drawStatus(false));
  client.on("message", (topic, buf) => {
    const id = topic.split("/").pop();
    presence[id] = buf.toString();
    drawStatus(client.connected);
  });

  const history = [];
  const drawHist = () => {
    $("hist").innerHTML = history.map((h,i) =>
      `<div class="item"><span class="txt">${h.text.replace(/</g,"&lt;")}</span>
       <button class="small ghost" data-i="${i}">Repeat</button></div>`).join("");
    $("hist").querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => publish(history[+b.dataset.i], false)));
  };

  function publish(msg, remember = true){
    if(!client.connected) return;
    client.publish(T.say(ROOM), JSON.stringify(msg));
    if(remember){
      history.unshift(msg);
      if(history.length > 8) history.pop();
      drawHist();
    }
  }

  $("rate").addEventListener("input", e => { $("ratev").textContent = e.target.value; });

  $("send").addEventListener("click", () => {
    const text = $("text").value.trim();
    if(!text) return;
    localStorage.setItem("ctts_voice", $("voice").value);
    publish({ text, target: $("target").value, voice: $("voice").value, rate: parseFloat($("rate").value) });
    $("text").select();
  });

  $("text").addEventListener("keydown", e => {
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("send").click();
  });

  $("stop").addEventListener("click", () => {
    if(client.connected) client.publish(T.stop(ROOM), "1");
  });
}

/* ---------------- classroom screen / receiver ---------------- */
function renderReceiver(){
  document.body.classList.add("recv");
  const n = SCREENS.indexOf(MY_ID) + 1;
  app.innerHTML = `
    <button class="arm" id="arm">Tap to go live<br><span style="font-size:.35em;font-weight:400;opacity:.8">Screen ${n||"?"} · room ${ROOM}</span></button>
    <div class="stage" id="stage">
      <div class="spoken" id="spoken"></div>
      <div class="idle" id="idle">Ready</div>
    </div>
    <div class="badge" id="badge" style="display:none">Screen ${n||"?"} · <b>live</b></div>`;

  const $ = id => document.getElementById(id);
  let client = null, keepAlive = null;

  // Warm the speech engine with a silent utterance so the first real one isn't delayed.
  function arm(){
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
    $("arm").style.display = "none";
    $("stage").classList.add("on");
    $("badge").style.display = "block";
    start();
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  }

  function speak(msg){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(msg.text);
    const v = speechSynthesis.getVoices().find(x => x.name === msg.voice);
    if(v) u.voice = v;
    u.rate = msg.rate || 1;
    $("spoken").textContent = msg.text;
    $("idle").textContent = "Speaking";
    u.onend = u.onerror = () => { $("idle").textContent = "Ready"; };
    speechSynthesis.speak(u);

    // Edge/Chrome stall out on utterances past ~15s unless nudged.
    clearInterval(keepAlive);
    keepAlive = setInterval(() => {
      if(speechSynthesis.speaking){ speechSynthesis.pause(); speechSynthesis.resume(); }
      else clearInterval(keepAlive);
    }, 10000);
  }

  function start(){
    client = connect({
      will: { topic: T.pres(ROOM, MY_ID), payload: "offline", retain: true, qos: 0 }
    });
    client.on("connect", () => {
      $("badge").classList.remove("down");
      $("badge").querySelector("b").textContent = "live";
      client.publish(T.pres(ROOM, MY_ID), "online", { retain: true });
      client.subscribe([T.say(ROOM), T.stop(ROOM)]);
    });
    client.on("close", () => {
      $("badge").classList.add("down");
      $("badge").querySelector("b").textContent = "reconnecting";
    });
    client.on("message", (topic, buf) => {
      if(topic === T.stop(ROOM)){
        speechSynthesis.cancel();
        $("idle").textContent = "Ready";
        return;
      }
      let msg;
      try { msg = JSON.parse(buf.toString()); } catch(e){ return; }
      if(msg.target !== "all" && msg.target !== MY_ID) return;
      speak(msg);
    });
  }

  $("arm").addEventListener("click", arm);
  window.addEventListener("beforeunload", () => {
    if(client && client.connected) client.publish(T.pres(ROOM, MY_ID), "offline", { retain: true });
  });
}

/* ---------------- boot ---------------- */
if(typeof mqtt === "undefined"){
  app.innerHTML = '<div class="wrap"><header><h1>mqtt.min.js is missing</h1><p class="sub">Upload mqtt.min.js into the same folder as this page in your repo, then reload.</p></header></div>';
} else if(ROLE === "setup" || !ROOM){
  renderSetup();
} else if(ROLE === "send"){
  renderSender();
} else {
  renderReceiver();
}
</script>
</body>
</html>
