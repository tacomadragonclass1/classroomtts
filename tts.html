<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom TTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171c; --panel:#1c2026; --panel-2:#22272e; --line:#2e343d;
    --text:#e9ebee; --muted:#8b94a2; --faint:#5b6472;
    --acc:#9db2cc; --acc-dim:#9db2cc33; --acc-ink:#10141a;
    --live:#4ecdb4; --off:#e07a7a;
    --radius:10px;
    --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
    --sans:"Archivo", "Segoe UI", system-ui, sans-serif;
  }
  body[data-engine="system"]{ --acc:#9db2cc; --acc-dim:#9db2cc2e; }
  body[data-engine="piper"] { --acc:#4ecdb4; --acc-dim:#4ecdb42e; }
  body[data-engine="kokoro"]{ --acc:#f5a95c; --acc-dim:#f5a95c2e; }

  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.55;min-height:100vh}
  main{max-width:920px;margin:0 auto;padding:26px 20px 70px}

  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin-bottom:20px}
  .wordmark{font-variation-settings:"wdth" 125,"wght" 900;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
  .wordmark .dot{color:var(--acc);transition:color .25s}
  .tagline{font-family:var(--mono);font-size:12px;color:var(--muted)}

  .presence{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{font-family:var(--mono);font-size:11.5px;padding:5px 11px;border:1px solid var(--line);
        border-radius:6px;color:var(--faint);display:flex;align-items:center;gap:7px}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .chip[data-live="1"]{color:var(--live);border-color:#4ecdb444}
  .chip[data-live="1"]::before{background:var(--live)}
  .chip[data-live="0"]{color:var(--off);border-color:#e07a7a44}
  .chip[data-live="0"]::before{background:var(--off)}

  .engines{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .engine{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
          padding:14px 14px 12px;cursor:pointer;text-align:left;color:var(--text);
          font-family:var(--sans);transition:border-color .18s,background .18s,transform .08s}
  .engine:hover{border-color:var(--faint)}
  .engine:active{transform:scale(.99)}
  .engine[aria-pressed="true"]{border-color:var(--acc);background:linear-gradient(180deg,var(--acc-dim),transparent 70%) var(--panel)}
  .engine .tier{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .engine[aria-pressed="true"] .tier{color:var(--acc)}
  .engine .ename{font-variation-settings:"wdth" 116,"wght" 800;font-size:18px;margin:2px 0 4px}
  .engine .emeta{font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.5}

  .bench{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  textarea{display:block;width:100%;background:transparent;border:0;resize:vertical;min-height:120px;
           padding:18px;color:var(--text);font-family:var(--sans);font-size:18px;line-height:1.6}
  textarea:focus{outline:none}
  textarea::placeholder{color:var(--faint)}

  .controls{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 18px}
  .ctl{display:flex;flex-direction:column;gap:5px}
  .ctl label{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:7px;
         padding:8px 10px;font-family:var(--sans);font-size:14px;max-width:250px}
  select:focus-visible,.engine:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .slider .row{display:flex;align-items:center;gap:8px}
  .slider output{font-family:var(--mono);font-size:12px;color:var(--acc);min-width:36px;text-align:right}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100px;height:4px;border-radius:2px;background:var(--line);cursor:pointer}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acc);border:none}
  input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--acc);border:none}

  .ctl .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:none;color:var(--faint);margin-left:4px}
  .ctl.off label{color:var(--faint)}
  .ctl.off select,.ctl.off input[type="range"]{opacity:.4;cursor:not-allowed}
  .ctl.off output{opacity:.4}
  .actions{margin-left:auto;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  button.btn{font-family:var(--sans);font-size:14px;font-weight:700;border-radius:8px;border:1px solid var(--line);
             background:var(--panel-2);color:var(--text);padding:10px 16px;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s}
  button.btn:hover:not(:disabled){border-color:var(--faint)}
  button.btn:disabled{opacity:.38;cursor:not-allowed}
  button.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);
                     font-variation-settings:"wdth" 110,"wght" 800;letter-spacing:.03em;padding:10px 24px}
  button.btn.primary:hover:not(:disabled){filter:brightness(1.08)}

  .console{border-top:1px solid var(--line);background:#171a1f;padding:9px 16px;font-family:var(--mono);
           font-size:12px;color:var(--muted);display:flex;align-items:center;gap:12px;min-height:38px}
  .console .led{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
  .console.busy .led{background:var(--acc);animation:pulse 1s ease-in-out infinite}
  .console.ready .led{background:var(--acc)}
  .console.error .led{background:var(--off)}
  .console.error{color:var(--off)}
  @keyframes pulse{50%{opacity:.25}}
  .console .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:none}
  .console.busy .progress.on{display:block}
  .progress i{display:block;height:100%;width:0%;background:var(--acc);transition:width .2s}

  .wavewrap{border-top:1px solid var(--line);position:relative}
  canvas#wave{display:block;width:100%;height:80px}
  .wavehint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);pointer-events:none}

  .hist{margin-top:22px}
  .hist h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--muted);font-weight:500;margin-bottom:8px}
  .hitem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 12px;
         background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  .hitem .txt{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hitem .meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
  .hitem button{font-size:12.5px;padding:6px 12px}

  .notes{margin-top:28px;display:grid;gap:13px}
  .note{border-left:2px solid var(--line);padding:2px 0 2px 14px;color:var(--muted);font-size:14px}
  .note b{color:var(--text);font-weight:700}
  .note code{font-family:var(--mono);font-size:12.5px;color:var(--acc);background:var(--panel);padding:1px 5px;border-radius:4px}
  .note.sys{border-color:#9db2cc}.note.pip{border-color:#4ecdb4}.note.kok{border-color:#f5a95c}.note.fx{border-color:#b48ef0}
  .link-out{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);
            border-radius:7px;padding:10px 12px;word-break:break-all;margin-bottom:10px;color:var(--text)}
  .setup-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:block}
  input[type=text]{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:7px;
                   padding:10px 12px;font-family:var(--mono);font-size:15px;width:100%;max-width:320px}
  footer{margin-top:32px;font-family:var(--mono);font-size:11.5px;color:var(--faint)}

  body.recv{display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  .arm{width:100vw;height:100vh;border:0;background:var(--panel);color:var(--text);
       font-family:var(--sans);font-variation-settings:"wdth" 110,"wght" 800;
       font-size:5.5vw;letter-spacing:-.01em;cursor:pointer}
  .arm span{display:block;font-size:.28em;font-variation-settings:"wdth" 100,"wght" 400;color:var(--muted);margin-top:.6em;font-family:var(--mono)}
  .stage{display:none;width:100vw;height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:4vw;gap:4vh}
  .stage.on{display:flex}
  .spoken{font-size:clamp(34px,8vw,140px);font-variation-settings:"wdth" 112,"wght" 750;
          letter-spacing:-.025em;line-height:1.1;max-width:94vw}
  .rstat{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .badge{position:fixed;top:14px;left:16px;font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;align-items:center;gap:7px}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--off)}
  .badge[data-live="1"]::before{background:var(--live)}

  @media(max-width:680px){.engines{grid-template-columns:1fr}.actions{margin-left:0;width:100%}.actions .primary{flex:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-engine="system">
<div id="app"></div>

<script src="mqtt.min.js"></script>
<script type="module">
/* =============================================================
   Classroom TTS — teacher console + classroom screens
     ?room=CODE&mode=send   teacher console
     ?room=CODE&id=screen1  classroom screen
     (no params)            setup / link generator

   Three tiers. Piper and Kokoro synthesize ON THE TEACHER LAPTOP
   and ship finished audio to the screens; the screens never
   download an engine. Instant ships text; the screen's own Edge
   voice speaks it.
   ============================================================= */

const P       = new URLSearchParams(location.search);
const ROOM    = P.get("room") || "";
const MY_ID   = P.get("id") || "";
const ROLE    = P.get("mode") === "send" ? "send" : (MY_ID ? "recv" : "setup");
const SCREENS = ["screen1", "screen2"];
const BROKERS = {
  hivemq: "wss://broker.hivemq.com:8884/mqtt",
  emqx:   "wss://broker.emqx.io:8084/mqtt",
};
const BROKER  = BROKERS[P.get("broker")] || BROKERS.hivemq;
const app     = document.getElementById("app");

const TOPIC = {
  say:     r => `ctts/${r}/say`,     // {target, display, segments:[{p}|{t,v,r,vol}]}
  audio:   r => `ctts/${r}/audio`,   // {id, target, text, chunks}
  chunk:   r => `ctts/${r}/chunk`,   // {id, i, d}
  stop:    r => `ctts/${r}/stop`,
  pres:    (r, id) => `ctts/${r}/presence/${id}`,
  presAll: r => `ctts/${r}/presence/+`,
};
const CHUNK_LEN  = 40000;   // base64 chars per MQTT message
const TARGET_SR  = 24000;   // every buffer-tier output is resampled here so pauses/chimes splice safely

function connect(opts = {}) {
  return mqtt.connect(BROKER, {
    clientId: "ctts_" + Math.random().toString(16).slice(2, 10),
    clean: true, reconnectPeriod: 2000, connectTimeout: 8000, ...opts,
  });
}
const esc = s => String(s).replace(/[<>&"]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" }[c]));

/* ============================================================
   SETUP
   ============================================================ */
function renderSetup() {
  const seed = Math.random().toString(36).slice(2, 6) + Math.random().toString(36).slice(2, 6);
  const base = location.origin + location.pathname;
  app.innerHTML = `
    <main>
      <header>
        <div class="wordmark">Classroom TTS<span class="dot">.</span></div>
        <div class="tagline">room links</div>
      </header>
      <p style="color:var(--muted);max-width:64ch;margin-bottom:8px">
        Bookmark all three. Open the screen links on the classroom laptops in
        <b style="color:var(--text)">Microsoft Edge</b> — Chrome only exposes five robotic voices there.
      </p>
      <label class="setup-label" for="roomin">Room code</label>
      <input type="text" id="roomin" value="${seed}">
      <p style="color:var(--faint);font-size:13px;margin-top:8px;max-width:64ch">
        Anyone who knows this code can send audio to your screens. Keep it random and off the repo description.
      </p>
      <div id="links" style="margin-top:20px"></div>
      <button class="btn primary" id="go" style="margin-top:6px">Open teacher console</button>
    </main>`;
  const draw = () => {
    const r = document.getElementById("roomin").value.trim();
    document.getElementById("links").innerHTML =
      `<span class="setup-label">Teacher laptop</span><div class="link-out">${base}?room=${r}&amp;mode=send</div>` +
      SCREENS.map((s, i) =>
        `<span class="setup-label">Classroom screen ${i + 1}</span><div class="link-out">${base}?room=${r}&amp;id=${s}</div>`).join("");
  };
  draw();
  document.getElementById("roomin").addEventListener("input", draw);
  document.getElementById("go").addEventListener("click", () => {
    location.search = "?room=" + document.getElementById("roomin").value.trim() + "&mode=send";
  });
}

/* ============================================================
   VOICE CATALOGS (English only)
   ============================================================ */
const KOKORO_VOICES = [
  ["US female", [
    ["af_heart","Heart ★ best overall"],["af_bella","Bella ★"],["af_nicole","Nicole (whispery)"],
    ["af_sarah","Sarah"],["af_sky","Sky"],["af_nova","Nova"],["af_aoede","Aoede"],
    ["af_kore","Kore"],["af_alloy","Alloy"],["af_jessica","Jessica"],["af_river","River"],
  ]],
  ["US male", [
    ["am_michael","Michael ★"],["am_fenrir","Fenrir ★"],["am_puck","Puck"],["am_adam","Adam"],
    ["am_echo","Echo"],["am_eric","Eric"],["am_liam","Liam"],["am_onyx","Onyx"],["am_santa","Santa"],
  ]],
  ["UK female", [
    ["bf_emma","Emma ★"],["bf_isabella","Isabella"],["bf_alice","Alice"],["bf_lily","Lily"],
  ]],
  ["UK male", [
    ["bm_george","George ★"],["bm_fable","Fable"],["bm_lewis","Lewis"],["bm_daniel","Daniel"],
  ]],
];
const PIPER_VOICES = [
  ["US English", [
    ["en_US-hfc_female-medium","HFC Female (medium) ★"],["en_US-hfc_male-medium","HFC Male (medium) ★"],
    ["en_US-libritts-high","LibriTTS (high)"],["en_US-libritts_r-medium","LibriTTS-R (medium)"],
    ["en_US-ryan-high","Ryan (high)"],["en_US-ryan-medium","Ryan (medium)"],["en_US-ryan-low","Ryan (low)"],
    ["en_US-lessac-high","Lessac (high)"],["en_US-lessac-medium","Lessac (medium)"],["en_US-lessac-low","Lessac (low)"],
    ["en_US-ljspeech-high","LJSpeech (high)"],["en_US-ljspeech-medium","LJSpeech (medium)"],
    ["en_US-amy-medium","Amy (medium)"],["en_US-amy-low","Amy (low)"],
    ["en_US-joe-medium","Joe (medium)"],["en_US-kristin-medium","Kristin (medium)"],
    ["en_US-kusal-medium","Kusal (medium)"],["en_US-arctic-medium","Arctic multi-speaker (medium)"],
    ["en_US-l2arctic-medium","L2 Arctic accents (medium)"],["en_US-kathleen-low","Kathleen (low)"],
    ["en_US-danny-low","Danny (low)"],
  ]],
  ["UK English", [
    ["en_GB-cori-high","Cori (high)"],["en_GB-cori-medium","Cori (medium)"],
    ["en_GB-alba-medium","Alba — Scottish (medium)"],["en_GB-jenny_dioco-medium","Jenny (medium)"],
    ["en_GB-northern_english_male-medium","Northern English Male (medium)"],["en_GB-aru-medium","Aru (medium)"],
    ["en_GB-semaine-medium","Semaine (medium)"],["en_GB-vctk-medium","VCTK multi-speaker (medium)"],
    ["en_GB-alan-medium","Alan (medium)"],["en_GB-alan-low","Alan (low)"],
    ["en_GB-southern_english_female-low","Southern English Female (low)"],
  ]],
];
const KOKORO_MODEL = "onnx-community/Kokoro-82M-v1.0-ONNX";

/* ============================================================
   STAGE DIRECTION PARSER
   Strict: anything bracket-shaped that doesn't parse blocks the
   send with a named error, so mistakes fail on the teacher
   laptop and are never spoken to the class.

   Items: {type:"pause",seconds} {type:"tone",kind} 
          {type:"text",text,style:{voice,pace,volume,effect,pitch}}
   ============================================================ */
const PACE_MULT = { slow:0.78, fast:1.22, whisper:0.9, emphasize:0.9 };
const EFFECTS = ["robot","ghost","demon","chipmunk","telephone","echo","reverse"];
const INSTANT_OK = { pace:["slow","fast"] };   // whisper/emphasize need the buffer

function parseDirections(input, tier, resolveVoice) {
  const items = [], errors = [], warnings = [];
  const style = { voice:null, voiceLabel:null, pace:null, volume:1, effect:null, pitch:null };
  const open  = { pace:null, voice:null, volume:null, effect:null, pitch:null };
  let container = null;   // {kind:"repeat"|"spell", n, text}

  const err = m => errors.push(m);

  const pushText = raw => {
    const t = raw.replace(/\s+/g, " ").trim();
    if (!t) return;
    if (container) { container.text += (container.text ? " " : "") + t; return; }
    items.push({ type:"text", text:t, style:{ ...style } });
  };

  const closeContainer = () => {
    const c = container; container = null;
    const t = c.text.trim();
    if (!t) return err(`[${c.kind.toUpperCase()}] is empty.`);
    if (c.kind === "repeat") {
      for (let i = 0; i < c.n; i++) {
        if (i) items.push({ type:"pause", seconds:0.4 });
        items.push({ type:"text", text:t, style:{ ...style } });
      }
    } else { // spell — letter NAMES, which every engine says cleanly
      const chars = t.replace(/[^A-Za-z0-9]/g, "");
      if (!chars) return err("[SPELL] needs letters or digits inside it.");
      [...chars].forEach((ch, i) => {
        if (i) items.push({ type:"pause", seconds:0.3 });
        items.push({ type:"text", text: ch.toUpperCase() + ".", style:{ ...style } });
      });
    }
  };

  const NUM = /^\d*\.?\d+$/;          // parseFloat("1,5") silently gives 1 — reject anything non-numeric outright
  const badNum = (tok, hint) => err(`${tok}: "${hint}" isn't a plain number — use a dot for decimals, like 1.5.`);

  const tokenRe = /\[[^\][\n]*\]/g;
  let last = 0;
  for (const m of input.matchAll(tokenRe)) {
    pushText(input.slice(last, m.index));
    last = m.index + m[0].length;

    const body = m[0].slice(1, -1).trim();
    const closing = body.startsWith("/");
    const parts = (closing ? body.slice(1) : body).trim().split(/\s+/);
    const kw = (parts[0] || "").toUpperCase();
    const arg = parts.slice(1).join(" ");
    const tok = `[${body}]`;

    /* inside REPEAT/SPELL only the matching close is legal */
    if (container) {
      if (closing && kw === container.kind.toUpperCase()) { closeContainer(); continue; }
      err(`${tok} can't appear inside [${container.kind.toUpperCase()}] — only plain text there.`);
      continue;
    }

    if (!closing) {
      if (kw === "PAUSE") {
        if (arg && !NUM.test(arg)) { badNum(tok, arg); continue; }
        const n = arg ? parseFloat(arg) : 0.7;
        if (!Number.isFinite(n) || n < 0 || n > 30) { err(`${tok}: pause must be a number of seconds from 0 to 30, like [PAUSE 1.5].`); continue; }
        items.push({ type:"pause", seconds:n });
      }
      else if (kw === "BREATH") items.push({ type:"pause", seconds:0.35 });
      else if (kw === "CHIME" || kw === "DING") {
        if (tier === "system") { err(`${tok} needs Fast or Studio.`); continue; }
        items.push({ type:"tone", kind: kw.toLowerCase() });
      }
      else if (["SLOW","FAST","WHISPER","EMPHASIZE"].includes(kw)) {
        const v = kw.toLowerCase();
        if (open.pace) { err(`${tok}: [${open.pace.toUpperCase()}] is still open — close it first with [/${open.pace.toUpperCase()}].`); continue; }
        if (tier === "system" && !INSTANT_OK.pace.includes(v)) { err(`${tok} needs Fast or Studio — Instant can't shape its audio.`); continue; }
        open.pace = v; style.pace = v;
      }
      else if (kw === "VOICE") {
        if (open.voice) { err(`${tok}: [VOICE ${open.voice}] is still open — close it with [/VOICE] first.`); continue; }
        if (!arg) { err(`[VOICE] needs a name, like [VOICE bella].`); continue; }
        const hit = resolveVoice(arg);
        if (!hit) { err(`[VOICE ${arg}]: no ${tier === "system" ? "Edge" : tier} voice matches "${arg}".`); continue; }
        open.voice = arg; style.voice = hit.id; style.voiceLabel = hit.label;
      }
      else if (kw === "VOLUME" || kw === "LOUD" || kw === "QUIET") {
        if (open.volume) { err(`${tok}: a volume tag is still open — close it first.`); continue; }
        if (kw === "VOLUME" && !NUM.test(arg)) { badNum(tok, arg || "(missing)"); continue; }
        let v = kw === "LOUD" ? 1.4 : kw === "QUIET" ? 0.5 : parseFloat(arg);
        if (kw === "VOLUME" && (!Number.isFinite(v) || v < 0.1 || v > 2)) { err(`${tok}: volume must be 0.1 to 2, like [VOLUME 0.6].`); continue; }
        open.volume = kw.toLowerCase(); style.volume = v;
      }
      else if (kw === "PITCH") {
        if (tier === "system") { err(`${tok} needs Fast or Studio — Edge voices ignore pitch.`); continue; }
        if (open.pitch) { err(`${tok}: [PITCH] is still open — close it with [/PITCH] first.`); continue; }
        if (!NUM.test(arg)) { badNum(tok, arg || "(missing)"); continue; }
        const v = parseFloat(arg);
        if (!Number.isFinite(v) || v < 0.5 || v > 2) { err(`${tok}: pitch must be 0.5 to 2, like [PITCH 0.8].`); continue; }
        open.pitch = "pitch"; style.pitch = v;
      }
      else if (EFFECTS.includes(kw.toLowerCase())) {
        if (tier === "system") { err(`${tok} needs Fast or Studio — effects require the audio buffer.`); continue; }
        if (open.effect) { err(`${tok}: [${open.effect.toUpperCase()}] is still open — close it first.`); continue; }
        open.effect = kw.toLowerCase(); style.effect = kw.toLowerCase();
      }
      else if (kw === "REPEAT") {
        if (!/^\d+$/.test(arg)) { err(`${tok}: use [REPEAT 3] with a whole number from 2 to 10.`); continue; }
        const n = parseInt(arg, 10);
        if (!Number.isFinite(n) || n < 2 || n > 10) { err(`${tok}: use [REPEAT 3] with a count from 2 to 10.`); continue; }
        container = { kind:"repeat", n, text:"" };
      }
      else if (kw === "SPELL") container = { kind:"spell", text:"" };
      else err(`${tok} isn't a direction I know. Check spelling — e.g. [PAUSE 1.5], [WHISPER], [VOICE bella] — or remove the brackets.`);
    }
    else { /* closing tags */
      if (["SLOW","FAST","WHISPER","EMPHASIZE"].includes(kw)) {
        if (open.pace !== kw.toLowerCase()) { err(`${tok} has no matching open [${kw}].`); continue; }
        open.pace = null; style.pace = null;
      }
      else if (kw === "VOICE")  { if (!open.voice)  { err(`${tok} has no matching open [VOICE …].`); continue; } open.voice = null;  style.voice = null; style.voiceLabel = null; }
      else if (["VOLUME","LOUD","QUIET"].includes(kw)) {
        if (open.volume !== kw.toLowerCase()) { err(`${tok} has no matching open [${kw}].`); continue; }
        open.volume = null; style.volume = 1;
      }
      else if (kw === "PITCH")  { if (!open.pitch)  { err(`${tok} has no matching open [PITCH …].`); continue; } open.pitch = null;  style.pitch = null; }
      else if (EFFECTS.includes(kw.toLowerCase())) {
        if (open.effect !== kw.toLowerCase()) { err(`${tok} has no matching open [${kw}].`); continue; }
        open.effect = null; style.effect = null;
      }
      else if (["REPEAT","SPELL"].includes(kw)) err(`${tok} has no matching open [${kw} …].`);
      else err(`${tok} isn't a direction I know.`);
    }
  }
  pushText(input.slice(last));

  if (container) { err(`[${container.kind.toUpperCase()}] was never closed — add [/${container.kind.toUpperCase()}].`); }
  for (const [ch, v] of Object.entries(open)) {
    if (v && ch !== "voice") warnings.push(`[${String(v).toUpperCase()}] wasn't closed — applied to the end.`);
    if (v && ch === "voice") warnings.push(`[VOICE ${v}] wasn't closed — applied to the end.`);
  }
  if (!items.some(i => i.type === "text" || i.type === "tone")) err("Nothing to speak once directions were removed.");

  const display = items.filter(i => i.type === "text").map(i => i.text).join(" ");
  return { items, errors, warnings, display };
}

    w(0,"RIFF"); dv.setUint32(4, 36 + n * 2, true); w(8,"WAVE");

    dv.setUint32(24,sampleRate,true); dv.setUint32(28,sampleRate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
    w(36,"data"); dv.setUint32(40, n * 2, true);

    if (buffer.sampleRate === sr) return buffer;
    const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(buffer.duration * sr)), sr);
    const src = off.createBufferSource();
    src.buffer = buffer; src.connect(off.destination); src.start();
    return off.startRendering();
  }

  /* ---------- SoundTouch: tempo (pitch-preserving) and pitch (length-preserving) ---------- */
  async function soundtouchProcess(buffer, { tempo = 1, pitch = 1 } = {}) {
    if (Math.abs(tempo - 1) < 0.001 && Math.abs(pitch - 1) < 0.001) return buffer;
    state.soundtouchMod ??= await import("https://cdn.jsdelivr.net/npm/soundtouchjs@0.3.0/+esm");
    const { SoundTouch, SimpleFilter } = state.soundtouchMod;
    const sr = buffer.sampleRate, monoIn = buffer.getChannelData(0);
    const mono = new Float32Array(monoIn.length + sr);   // 1s flush pad — the pipeline holds ~0.3s at EOS
    mono.set(monoIn);
    const st = new SoundTouch();
    st.tempo = tempo; st.pitch = pitch;
    const source = {
      extract(target, numFrames, position) {
        const n = Math.max(0, Math.min(numFrames, mono.length - position));
        for (let i = 0; i < n; i++) { target[2*i] = mono[position + i]; target[2*i+1] = mono[position + i]; }
        return n;
      }
    };
    const filter = new SimpleFilter(source, st);
    const STEP = 8192, tmp = new Float32Array(STEP * 2), chunks = [];
    let total = 0;
    const want = Math.ceil(monoIn.length / tempo);
    while (total < want) {
      const n = filter.extract(tmp, STEP);
      if (!n) break;
      const m = new Float32Array(n);
      for (let i = 0; i < n; i++) m[i] = tmp[2*i];
      chunks.push(m); total += n;
    }
    const out = ctx().createBuffer(1, Math.min(total, want) || 1, sr);
    const dst = out.getChannelData(0);
    let off = 0;
    for (const c of chunks) {
      const take = Math.min(c.length, dst.length - off);
      if (take <= 0) break;
      dst.set(c.subarray(0, take), off); off += take;
    }
    return out;
  }

  /* ---------- effects rack ---------- */
  function makeImpulse(off, seconds, decay, darkHz = 0) {
    const sr = off.sampleRate, len = Math.max(1, Math.floor(seconds * sr));
    const buf = off.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    if (darkHz) { const a = Math.exp(-2 * Math.PI * darkHz / sr); let y = 0; for (let i = 0; i < len; i++) { y = (1 - a) * d[i] + a * y; d[i] = y; } }
    return buf;
  }

    const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x)); }
    return curve;
  }
  async function renderEffect(base, fx) {
    if (fx === "none") return base;
    if (fx === "reverse") {
      const out = ctx().createBuffer(1, base.length, base.sampleRate);
      const src = base.getChannelData(0), dst = out.getChannelData(0);
      for (let i = 0, n = src.length; i < n; i++) dst[i] = src[n - 1 - i];
      return out;
    }

                  chipmunk:{rate:1.5,tail:.05}, telephone:{rate:1,tail:.05}, echo:{rate:1,tail:2.2} }[fx];
    const sr = base.sampleRate;
    const off = new OfflineAudioContext(1, Math.ceil((base.duration / cfg.rate + cfg.tail) * sr), sr);
    const src = off.createBufferSource();
    src.buffer = base; src.playbackRate.value = cfg.rate;
    const out = off.createGain(); out.connect(off.destination);
    if (fx === "robot") {
      const hp = off.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=140;
      const ws = off.createWaveShaper(); ws.curve = shaperCurve(6);
      const ring = off.createGain(); ring.gain.value = 0;
      const osc = off.createOscillator(); osc.type="sine"; osc.frequency.value=32;
      osc.connect(ring.gain); osc.start();
      src.connect(hp); hp.connect(ws); ws.connect(ring); ring.connect(out); out.gain.value = 1.15;

      const dry = off.createGain(); dry.gain.value=.4; src.connect(dry); dry.connect(out);

      const wet = off.createGain(); wet.gain.value=.85; src.connect(conv); conv.connect(wet); wet.connect(out);
      const delay = off.createDelay(1); delay.delayTime.value=.28;
      const fb = off.createGain(); fb.gain.value=.35;
      const eo = off.createGain(); eo.gain.value=.4;
      src.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(eo); eo.connect(out);
    } else if (fx === "demon") {
      const lp = off.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2200;
      const dry = off.createGain(); dry.gain.value=.8; src.connect(lp); lp.connect(dry); dry.connect(out);

      const hp = off.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=350;
      const lp = off.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200;
      const ws = off.createWaveShaper(); ws.curve = shaperCurve(3);
      src.connect(hp); hp.connect(lp); lp.connect(ws); ws.connect(out); out.gain.value = 1.25;
    } else if (fx === "echo") {
      const dry = off.createGain(); dry.gain.value=.85; src.connect(dry); dry.connect(out);

      const fb = off.createGain(); fb.gain.value=.45;
      const wet = off.createGain(); wet.gain.value=.5;
      src.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(out);

    return off.startRendering();
  }

  /* gain + optional lowpass, applied per segment (whisper / volume / emphasize) */
  async function shapeSegment(buffer, gain, lowpassHz) {
    if (!lowpassHz) {
      if (Math.abs(gain - 1) < 0.001) return buffer;
      const out = ctx().createBuffer(1, buffer.length, buffer.sampleRate);
      const src = buffer.getChannelData(0), dst = out.getChannelData(0);
      for (let i = 0; i < src.length; i++) dst[i] = Math.max(-1, Math.min(1, src[i] * gain));
      return out;
    }

    const src = off.createBufferSource(); src.buffer = buffer;
    const lp = off.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = lowpassHz;
    const g = off.createGain(); g.gain.value = gain;
    src.connect(lp); lp.connect(g); g.connect(off.destination); src.start();
    return off.startRendering();
  }

  /* [CHIME] two ascending notes, [DING] one — synthesized, no files */
  async function renderTone(kind) {
    const notes = kind === "chime" ? [[1046.5, 0, .22], [1318.5, .16, .3]] : [[880, 0, .35]];
    const dur = Math.max(...notes.map(([,at,d]) => at + d)) + .08;
    const off = new OfflineAudioContext(1, Math.ceil(dur * TARGET_SR), TARGET_SR);
    for (const [freq, at, d] of notes) {
      const osc = off.createOscillator(); osc.type = "sine"; osc.frequency.value = freq;
      const g = off.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.5, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at + d);
      osc.connect(g); g.connect(off.destination);
      osc.start(at); osc.stop(at + d);
    }
    return off.startRendering();
  }

  /* ---------- waveform ---------- */
  let peaks = null;
  function sizeCanvas() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    els.wave.width = Math.round((els.wave.clientWidth || 800) * dpr);
    els.wave.height = Math.round(80 * dpr);
    peaks = null; drawWave();
  }
  function drawWave() {
    const c = els.wave.getContext("2d"), W = els.wave.width, H = els.wave.height;
    c.clearRect(0, 0, W, H);
    if (!state.buffer) { els.wavehint.style.display = "flex"; return; }
    els.wavehint.style.display = "none";
    const cols = Math.floor(W / 3);
    if (!peaks) {
      const data = state.buffer.getChannelData(0);
      const step = Math.max(1, Math.floor(data.length / cols));
      peaks = new Float32Array(cols);
      for (let i = 0; i < cols; i++) {
        let max = 0;
        for (let j = 0; j < step && i * step + j < data.length; j++) { const v = Math.abs(data[i * step + j]); if (v > max) max = v; }
        peaks[i] = max;
      }
    }
    c.fillStyle = getComputedStyle(document.body).getPropertyValue("--acc").trim() || "#f5a95c";
    for (let i = 0; i < cols; i++) {
      const h = Math.max(2, peaks[i] * H * 0.86);
      c.fillRect(i * 3, (H - h) / 2, 2, h);
    }
  }
  addEventListener("resize", sizeCanvas);

  /* ---------- voices ---------- */
  let systemVoices = [];
  function refreshSystemVoices() {
    const en = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    const rank = v => (/Natural/.test(v.name) ? 0 : v.localService ? 1 : 2);
    systemVoices = en.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
    if (state.engine === "system") fillVoices();
  }
  const flatCatalog = groups => groups.flatMap(([, list]) => list);
  function resolveVoice(q) {
    const s = q.toLowerCase().trim();
    if (state.engine === "system") {
      const v = systemVoices.find(x => x.name.toLowerCase().includes(s));
      return v ? { id: v.name, label: v.name.replace(/^Microsoft | Online \(Natural\)/g, "") } : null;
    }
    const cat = flatCatalog(state.engine === "piper" ? PIPER_VOICES : KOKORO_VOICES);
    const hit =
      cat.find(([id]) => id.toLowerCase() === s) ||
      cat.find(([id]) => id.toLowerCase().split(/[_-]/).includes(s)) ||
      cat.find(([id, label]) => id.toLowerCase().includes(s) || label.toLowerCase().includes(s));
    return hit ? { id: hit[0], label: hit[1] } : null;
  }
  function fillVoices() {
    const saved = load().voice?.[state.engine];
    els.voice.innerHTML = "";
    const opt = (parent, val, label) => { const o = document.createElement("option"); o.value = val; o.textContent = label; parent.appendChild(o); };
    if (state.engine === "system") {
      if (!systemVoices.length) { opt(els.voice, "", "No voices found"); return; }
      const nat = document.createElement("optgroup"); nat.label = "Neural (Edge)";
      const loc = document.createElement("optgroup"); loc.label = "Built-in";
      for (const v of systemVoices)
        opt(/Natural/.test(v.name) ? nat : loc, v.name, `${v.name.replace(/^Microsoft /,"").replace(/ Online \(Natural\)/,"")} — ${v.lang}`);
      if (nat.children.length) els.voice.appendChild(nat);
      if (loc.children.length) els.voice.appendChild(loc);
    } else {
      for (const [g, list] of (state.engine === "piper" ? PIPER_VOICES : KOKORO_VOICES)) {
        const og = document.createElement("optgroup"); og.label = g;
        for (const [val, label] of list) opt(og, val, label);
        els.voice.appendChild(og);
      }
    }
    if (saved && [...els.voice.querySelectorAll("option")].some(o => o.value === saved)) els.voice.value = saved;
  }

  /* ---------- engine switching ---------- */
  function setEngine(engine) {
    state.engine = engine;
    document.body.dataset.engine = engine;
    for (const b of document.querySelectorAll(".engine")) b.setAttribute("aria-pressed", String(b.dataset.engine === engine));

    /* Controls stay visible on every tier and disable where they can't work,
       so the reason is on screen instead of the control vanishing. */
    const buffered = engine !== "system";
    const why = "Edge speaks straight out of the speaker and never hands the page its audio, so there's nothing to process. Switch to Fast or Studio.";

    els.ctlEffect.classList.toggle("off", !buffered);
    els.ctlPitch.classList.toggle("off", !buffered);
    els.effect.disabled = !buffered;
    els.pitch.disabled  = !buffered;
    els.ctlEffect.title = buffered ? "" : why;
    els.ctlPitch.title  = buffered ? "" : why;
    els.effectHint.textContent = buffered ? "" : "needs Fast or Studio";
    els.pitchHint.textContent  = buffered ? "" : "needs Fast or Studio";

    els.ctlDevice.style.display = engine === "kokoro" ? "" : "none";
    els.wavewrap.style.display  = buffered ? "" : "none";
    els.download.disabled = !buffered || !state.blob;
    els.send.textContent = buffered ? "Synthesize & send" : "Send to screens";
    fillVoices(); drawWave(); save();
  }
  for (const b of document.querySelectorAll(".engine")) b.addEventListener("click", () => setEngine(b.dataset.engine));

  /* ---------- engine: kokoro ---------- */
  async function getKokoro(device) {
    if (state.kokoro.tts && state.kokoro.device === device) return state.kokoro.tts;
    if (state.kokoro.loading) return state.kokoro.loading;
    state.kokoro.loading = (async () => {
      setStatus("Loading kokoro-js…", "busy");
      const { KokoroTTS } = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm");
      const dtype = device === "webgpu" ? "fp32" : "q8";
      const seen = new Map();
      const tts = await KokoroTTS.from_pretrained(KOKORO_MODEL, {
        dtype, device,
        progress_callback: p => {
          if (p.status === "progress" && p.total) {
            seen.set(p.file, p);
            let loaded = 0, total = 0;
            for (const f of seen.values()) { loaded += f.loaded; total += f.total; }
            setStatus(`Downloading Kokoro (${dtype}) — ${fmtMB(loaded)} / ${fmtMB(total)} MB`, "busy", loaded / total * 100);
          }
        },
      });
      state.kokoro.tts = tts; state.kokoro.device = device; state.kokoro.loading = null;
      return tts;
    })();
    return state.kokoro.loading;
  }
  async function kokoroSegment(text, voice, speed) {
    let device = els.device.value, tts;
    try { tts = await getKokoro(device); }
    catch (err) {
      if (device !== "webgpu") throw err;
      setStatus("WebGPU unavailable — falling back to CPU…", "busy");
      state.kokoro.loading = null; els.device.value = device = "wasm";
      tts = await getKokoro(device);
    }
    const audio = await tts.generate(text, { voice, speed: Math.max(.5, Math.min(2, speed)) });
    const buf = ctx().createBuffer(1, audio.audio.length, audio.sampling_rate);
    buf.getChannelData(0).set(audio.audio);
    return buf;
  }

  /* ---------- engine: piper ----------
     Piper pulls its runtime from jsDelivr and voice files from
     huggingface.co/rhasspy/piper-voices. When a filter blocks either,
     the underlying promise never settles and never rejects — so every
     stage gets a watchdog and a reachability probe on failure. */

  const withTimeout = (promise, ms, label, getIdle) => new Promise((resolve, reject) => {
    let done = false;
    const timer = setInterval(() => {
      if (done) return clearInterval(timer);
      const idle = getIdle ? getIdle() : Infinity;
      if (idle >= ms) {
        clearInterval(timer);
        reject(new Error(`${label} stalled — no activity for ${Math.round(ms / 1000)}s.`));
      }
    }, 1000);
    promise.then(v => { done = true; clearInterval(timer); resolve(v); },
                 e => { done = true; clearInterval(timer); reject(e); });
  });

  async function probeReachability() {
    const targets = [
      ["jsDelivr (library CDN)", "https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/package.json"],
      ["Hugging Face (voice files)", "https://huggingface.co/rhasspy/piper-voices/resolve/main/voices.json"],
    ];
    const out = [];
    for (const [name, url] of targets) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 8000);
        const r = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        clearTimeout(t);
        out.push(`${name}: ${r.ok ? "reachable" : "HTTP " + r.status}`);
      } catch { out.push(`${name}: BLOCKED`); }
    }
    return out;
  }

  async function piperSegment(text, voiceId) {
    let lastTick = performance.now();
    const idle = () => performance.now() - lastTick;

    if (!state.piperMod) {
      setStatus("Loading Piper runtime from jsDelivr…", "busy");
      console.log("[piper] importing library…");
      try {
        state.piperMod = await withTimeout(
          import("https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/+esm"),
          45000, "Loading the Piper library", idle);
      } catch (e) {
        console.error("[piper] import failed", e);
        const probe = await probeReachability();
        throw new Error(`${e.message} — ${probe.join(" · ")}`);
      }
      console.log("[piper] library loaded", Object.keys(state.piperMod));
    }

    if (state.piperKey !== voiceId) {
      // The library reuses one session and never reloads on voice change;
      // resetting its singleton forces a clean init for the new voice.
      if (state.piperMod.TtsSession) state.piperMod.TtsSession._instance = null;
      else console.warn("[piper] TtsSession not exported — skipping session reset");
      state.piperKey = voiceId;
    }

    setStatus(`Preparing voice ${voiceId}…`, "busy");
    console.log("[piper] predict start", voiceId);
    lastTick = performance.now();

    let blob;
    try {
      blob = await withTimeout(
        state.piperMod.predict({ text, voiceId }, p => {
          lastTick = performance.now();
          const file = p?.url ? p.url.split("/").pop() : voiceId;
          if (p?.total) setStatus(`Downloading ${file} — ${fmtMB(p.loaded)} / ${fmtMB(p.total)} MB`, "busy", p.loaded / p.total * 100);
          else setStatus(`Fetching ${file}…`, "busy");
        }),
        90000, `Piper (voice ${voiceId})`, idle);
    } catch (e) {
      console.error("[piper] predict failed", e);
      const probe = await probeReachability();
      throw new Error(`${e.message} — ${probe.join(" · ")}`);
    }

    console.log("[piper] predict done", blob?.size, "bytes");
    if (!blob || !blob.size) throw new Error("Piper returned no audio for that voice.");
    return ctx().decodeAudioData(await blob.arrayBuffer());
  }

  /* ============================================================
     BUFFER PIPELINE — items in, one AudioBuffer out
     Every segment is resampled to TARGET_SR before splicing, so
     pauses, chimes, and mixed-rate Piper voices line up exactly.
     ============================================================ */
  async function synthesizeItems(items) {
    const baseRate = +els.rate.value;
    const segs = [];
    let n = 0;
    const speakable = items.filter(i => i.type === "text").length;

    for (const item of items) {
      if (item.type === "pause") {
        const buf = ctx().createBuffer(1, Math.max(1, Math.round(item.seconds * TARGET_SR)), TARGET_SR);
        segs.push(buf); continue;
      }
      if (item.type === "tone") { segs.push(await renderTone(item.kind)); continue; }

      n++;
      const st = item.style;
      const voice = st.voice || els.voice.value;
      const paceMult = st.pace ? PACE_MULT[st.pace] : 1;
      const speed = baseRate * paceMult;
      if (speakable > 1) setStatus(`Synthesizing ${n}/${speakable}…`, "busy");
      else setStatus("Synthesizing…", "busy");

      let buf;
      if (state.engine === "kokoro") {
        buf = await kokoroSegment(item.text, voice, speed);   // native speed
      } else {
        buf = await piperSegment(item.text, voice);           // speed via time-stretch
        if (Math.abs(speed - 1) > 0.001) buf = await soundtouchProcess(buf, { tempo: speed });
      }
      buf = await resampleTo(buf, TARGET_SR);

      const gain = (st.pace === "whisper" ? 0.35 : 1) * (st.pace === "emphasize" ? 1.25 : 1) * st.volume;
      buf = await shapeSegment(buf, gain, st.pace === "whisper" ? 4000 : 0);
      if (st.effect) buf = await renderEffect(buf, st.effect);
      if (st.pitch)  buf = await soundtouchProcess(buf, { pitch: st.pitch });
      segs.push(buf);
    }

    const total = segs.reduce((s, b) => s + b.length, 0);
    const out = ctx().createBuffer(1, Math.max(1, total), TARGET_SR);
    const dst = out.getChannelData(0);
    let off = 0;
    for (const b of segs) { dst.set(b.getChannelData(0), off); off += b.length; }

    let final = out;
    const globalPitch = +els.pitch.value;
    if (Math.abs(globalPitch - 1) > 0.001) { setStatus("Applying pitch…", "busy"); final = await soundtouchProcess(final, { pitch: globalPitch }); }
    if (els.effect.value !== "none") { setStatus(`Rendering ${els.effect.value}…`, "busy"); final = await renderEffect(final, els.effect.value); }
    return final;
  }

  /* ---------- Instant: items -> wire segments ---------- */
  function itemsToSegments(items) {
    const baseRate = +els.rate.value;
    return items.map(i => i.type === "pause"
      ? { p: i.seconds }
      : { t: i.text, v: i.style.voice || els.voice.value,
          r: Math.max(.1, Math.min(10, baseRate * (i.style.pace ? PACE_MULT[i.style.pace] : 1))),
          vol: Math.max(0, Math.min(1, i.style.volume)) });
  }

  /* local sequential playback of Instant segments (Preview) */
  function playSegmentsLocal(segments) {
    stopLocal();
    let idx = 0, timer = null, live = true;
    const next = () => {
      if (!live || idx >= segments.length) { state.localSeq = null; return; }
      const s = segments[idx++];
      if (s.p !== undefined) { timer = setTimeout(next, s.p * 1000); return; }
      const u = new SpeechSynthesisUtterance(s.t);
      const v = speechSynthesis.getVoices().find(x => x.name === s.v);
      if (v) u.voice = v;
      u.rate = s.r; u.volume = s.vol;
      u.onend = u.onerror = next;
      speechSynthesis.speak(u);
    };
    state.localSeq = () => { live = false; clearTimeout(timer); speechSynthesis.cancel(); };
    next();
  }
  function stopLocal() {
    if (state.localSeq) state.localSeq();
    state.localSeq = null;
    speechSynthesis.cancel();
  }

  /* ---------- mqtt ---------- */
  const client = connect();
  function drawPresence() {
    els.presence.innerHTML =
      `<span class="chip" data-live="${state.connected ? 1 : 0}">broker ${state.connected ? "connected" : "offline"}</span>` +
      SCREENS.map((s, i) => {
        const p = state.presence[s];
        const live = p === "online";
        return `<span class="chip" data-live="${live ? 1 : 0}">screen ${i + 1} ${live ? "live" : p === "open" ? "open, not armed" : "closed"}</span>`;
      }).join("");
  }
  drawPresence();
  client.on("connect", () => { state.connected = true; drawPresence(); client.subscribe(TOPIC.presAll(ROOM)); });
  client.on("close",   () => { state.connected = false; drawPresence(); });
  client.on("message", (t, buf) => { state.presence[t.split("/").pop()] = buf.toString(); drawPresence(); });

  function publishAudio(b64, text, target) {
    const id = Math.random().toString(36).slice(2, 10);
    const n = Math.ceil(b64.length / CHUNK_LEN);
    client.publish(TOPIC.audio(ROOM), JSON.stringify({ id, target, text, chunks: n }));
    for (let i = 0; i < n; i++) {
      client.publish(TOPIC.chunk(ROOM), JSON.stringify({ id, i, d: b64.slice(i * CHUNK_LEN, (i + 1) * CHUNK_LEN) }));
      setStatus(`Sending audio — ${i + 1}/${n}`, "busy", (i + 1) / n * 100);
    }
  }

  /* ---------- history (cache-as-sent) ---------- */
  const history = [];
  function fxLabel(entry) {
    if (entry.kind === "say") return "instant";
    const tags = [entry.tier];
    if (entry.fx) tags.push("fx");
    return tags.join(" · ");
  }
  function drawHistory() {
    els.hist.innerHTML = history.map((h, i) => `
      <div class="hitem">
        <span class="txt">${esc(h.display)}</span>
        <span class="meta">${esc(fxLabel(h))} · ${esc(h.label)}</span>
        <button class="btn" data-i="${i}">Resend</button>
      </div>`).join("");
    els.hist.querySelectorAll("button").forEach(b => b.addEventListener("click", () => resend(history[+b.dataset.i])));
  }
  function remember(entry) { history.unshift(entry); if (history.length > 8) history.pop(); drawHistory(); }
  function resend(h) {
    if (!state.connected) return setStatus("Not connected to the broker.", "error");
    if (h.kind === "say") client.publish(TOPIC.say(ROOM), JSON.stringify({ target: els.target.value, display: h.display, segments: h.segments }));
    else publishAudio(h.b64, h.display, els.target.value);
    setStatus("Resent exactly as originally sent.", "ready");
  }

  /* ---------- parse + report ---------- */
  function parseOrReport() {
    const text = els.text.value.trim();
    if (!text) { setStatus("Type something first.", "ready"); els.text.focus(); return null; }
    const r = parseDirections(text, state.engine, resolveVoice);
    if (r.errors.length) {
      setStatus(r.errors[0] + (r.errors.length > 1 ? ` (+${r.errors.length - 1} more — fix and retry)` : ""), "error");
      return null;
    }
    return r;
  }
  const noteWarnings = (r, base) =>
    setStatus(r.warnings.length ? `${base} Note: ${r.warnings[0]}` : base, "ready");

  /* ---------- actions ---------- */
  els.rate.addEventListener("input",  () => { els.rateOut.textContent  = (+els.rate.value).toFixed(2); save(); });
  els.pitch.addEventListener("input", () => { els.pitchOut.textContent = (+els.pitch.value).toFixed(2); save(); });
  els.voice.addEventListener("change", save);
  els.effect.addEventListener("change", save);
  els.device.addEventListener("change", () => { state.kokoro.tts = null; state.kokoro.loading = null; save(); });

  els.send.addEventListener("click", async () => {
    const r = parseOrReport();
    if (!r) return;
    if (!state.connected) return setStatus("Not connected to the broker.", "error");
    els.send.disabled = true;
    try {
      if (state.engine === "system") {
        const segments = itemsToSegments(r.items);
        client.publish(TOPIC.say(ROOM), JSON.stringify({ target: els.target.value, display: r.display, segments }));
        remember({ kind:"say", display: r.display, segments,
                   label: (els.voice.value || "").replace(/^Microsoft | Online \(Natural\)/g, "") });
        noteWarnings(r, "Sent.");
        els.text.select();
      } else {
        const t0 = performance.now();
        state.buffer = await synthesizeItems(r.items);
        state.blob = encodeWav(state.buffer.getChannelData(0), state.buffer.sampleRate);
        els.download.disabled = false;
        peaks = null; drawWave();
        const b64 = await blobToBase64(state.blob);
        publishAudio(b64, r.display, els.target.value);
        const usedFx = els.effect.value !== "none" || r.items.some(i => i.style?.effect);
        remember({ kind:"audio", display: r.display, b64, tier: state.engine === "piper" ? "fast" : "studio",
                   fx: usedFx, label: els.voice.value });
        const dt = ((performance.now() - t0) / 1000).toFixed(1);
        noteWarnings(r, `Sent — ${state.buffer.duration.toFixed(1)}s of audio in ${dt}s.`);
      }
    } catch (err) {
      console.error(err);
      setStatus("Error: " + (err?.message || err), "error");
    } finally { els.send.disabled = false; }
  });

  els.preview.addEventListener("click", async () => {
    const r = parseOrReport();
    if (!r) return;
    els.preview.disabled = true;
    try {
      if (state.engine === "system") {
        playSegmentsLocal(itemsToSegments(r.items));
        noteWarnings(r, "Previewing on this laptop only.");
      } else {
        state.buffer = await synthesizeItems(r.items);
        state.blob = encodeWav(state.buffer.getChannelData(0), state.buffer.sampleRate);
        els.download.disabled = false;
        peaks = null; drawWave();
        const src = ctx().createBufferSource();
        src.buffer = state.buffer; src.connect(ctx().destination); src.start();
        noteWarnings(r, "Previewing on this laptop only. Send ships this exact audio.");
      }
    } catch (err) { setStatus("Error: " + (err?.message || err), "error"); }
    finally { els.preview.disabled = false; }
  });

  els.stopall.addEventListener("click", () => {
    stopLocal();
    if (state.connected) client.publish(TOPIC.stop(ROOM), "1");
    setStatus("Stopped.", "ready");
  });

  els.download.addEventListener("click", () => {
    if (!state.blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(state.blob);
    a.download = `classroom-${els.voice.value}-${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.wav`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });

  els.text.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") els.send.click(); });

  /* ---------- boot ---------- */
  refreshSystemVoices();
  speechSynthesis.addEventListener?.("voiceschanged", refreshSystemVoices);
  const saved = load();
  if (saved.rate)  { els.rate.value  = saved.rate;  els.rateOut.textContent  = (+saved.rate).toFixed(2); }
  if (saved.pitch) { els.pitch.value = saved.pitch; els.pitchOut.textContent = (+saved.pitch).toFixed(2); }
  if (saved.effect) els.effect.value = saved.effect;
  if (!("gpu" in navigator)) {
    els.device.value = "wasm";
    const o = els.device.querySelector('[value="webgpu"]');
    o.disabled = true; o.textContent = "WebGPU (unavailable)";
  } else if (saved.device) els.device.value = saved.device;
  setEngine(["system","piper","kokoro"].includes(saved.engine) ? saved.engine : "system");
  sizeCanvas(); drawHistory();
}

/* ============================================================
   CLASSROOM SCREEN
   Never downloads an engine. Two jobs only:
   speak text segments with its own Edge voice, or play audio.
   ============================================================ */
function renderScreen() {
  document.body.classList.add("recv");
  const n = SCREENS.indexOf(MY_ID) + 1;
  app.innerHTML = `
    <button class="arm" id="arm">Tap to go live<span>screen ${n || "?"} · room ${esc(ROOM)}</span></button>
    <div class="stage" id="stage">
      <div class="spoken" id="spoken"></div>
      <div class="rstat" id="rstat">Ready</div>
    </div>
    <div class="badge" id="badge" data-live="0" style="display:none"><span id="badgetxt">connecting</span></div>`;

  const $ = id => document.getElementById(id);
  let client = null, audioCtx = null, source = null, keepAlive = null, armed = false;
  let seqCancel = null;
  const pending = new Map();

  const setStat  = t => { $("rstat").textContent = t; };
  const setBadge = (live, txt) => { $("badge").dataset.live = live ? "1" : "0"; $("badgetxt").textContent = txt; };

  function stopEverything() {
    if (seqCancel) { seqCancel(); seqCancel = null; }
    speechSynthesis.cancel();
    clearInterval(keepAlive);
    if (source) { try { source.stop(); } catch {} source = null; }
    setStat("Ready");
  }

  /* sequential text segments -> local Edge voice */
  function speakSegments(display, segments) {
    stopEverything();
    $("spoken").textContent = display;
    setStat("Speaking");
    let idx = 0, timer = null, live = true;
    const done = () => { seqCancel = null; setStat("Ready"); clearInterval(keepAlive); };
    const next = () => {
      if (!live) return;
      if (idx >= segments.length) return done();
      const s = segments[idx++];
      if (s.p !== undefined) { timer = setTimeout(next, s.p * 1000); return; }
      const u = new SpeechSynthesisUtterance(s.t);
      const v = speechSynthesis.getVoices().find(x => x.name === s.v);
      if (v) u.voice = v;
      u.rate = s.r || 1;
      if (s.vol !== undefined) u.volume = s.vol;
      u.onend = u.onerror = next;
      speechSynthesis.speak(u);
    };
    seqCancel = () => { live = false; clearTimeout(timer); };
    keepAlive = setInterval(() => {
      if (speechSynthesis.speaking) { speechSynthesis.pause(); speechSynthesis.resume(); }
    }, 10000);
    next();
  }

  async function playAudio(b64, text) {
    stopEverything();
    $("spoken").textContent = text;
    setStat("Playing");
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const buf = await audioCtx.decodeAudioData(bytes.buffer);
    source = audioCtx.createBufferSource();
    source.buffer = buf;
    source.connect(audioCtx.destination);
    source.onended = () => setStat("Ready");
    source.start();
  }

  function handle(topic, buf) {
    if (topic === TOPIC.stop(ROOM)) return stopEverything();
    let msg;
    try { msg = JSON.parse(buf.toString()); } catch { return; }

    if (topic === TOPIC.say(ROOM)) {
      if (msg.target !== "all" && msg.target !== MY_ID) return;
      if (!armed) return;
      if (msg.segments) speakSegments(msg.display || "", msg.segments);
      else if (msg.text) speakSegments(msg.text, [{ t: msg.text, v: msg.voice, r: msg.rate }]); // older console pages
      return;
    }
    if (topic === TOPIC.audio(ROOM)) {
      if (msg.target !== "all" && msg.target !== MY_ID) return;
      pending.set(msg.id, { meta: msg, parts: new Array(msg.chunks), have: 0 });
      setStat("Receiving");
      setTimeout(() => pending.delete(msg.id), 30000);
      return;
    }
    if (topic === TOPIC.chunk(ROOM)) {
      const entry = pending.get(msg.id);
      if (!entry) return;
      if (entry.parts[msg.i] === undefined) { entry.parts[msg.i] = msg.d; entry.have++; }
      if (entry.have === entry.meta.chunks) {
        pending.delete(msg.id);
        if (armed) playAudio(entry.parts.join(""), entry.meta.text).catch(() => setStat("Audio error"));
      }
    }
  }

  function start() {
    client = connect({ will: { topic: TOPIC.pres(ROOM, MY_ID), payload: "offline", retain: true, qos: 0 } });
    client.on("connect", () => {
      setBadge(armed, armed ? "live" : "open, not armed");
      client.publish(TOPIC.pres(ROOM, MY_ID), armed ? "online" : "open", { retain: true });
      client.subscribe([TOPIC.say(ROOM), TOPIC.audio(ROOM), TOPIC.chunk(ROOM), TOPIC.stop(ROOM)]);
    });
    client.on("close", () => setBadge(false, "reconnecting"));
    client.on("message", handle);
  }

  $("arm").addEventListener("click", () => {
    armed = true;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const warm = new SpeechSynthesisUtterance(" ");
    warm.volume = 0;
    speechSynthesis.speak(warm);
    audioCtx.resume();
    $("arm").style.display = "none";
    $("stage").classList.add("on");
    $("badge").style.display = "flex";
    setBadge(true, "live");
    if (client?.connected) client.publish(TOPIC.pres(ROOM, MY_ID), "online", { retain: true });
    document.documentElement.requestFullscreen?.().catch(() => {});
  });
  addEventListener("beforeunload", () => {
    if (client?.connected) client.publish(TOPIC.pres(ROOM, MY_ID), "offline", { retain: true });
  });

  start();   // connect immediately so the console sees "open" before arming
}

/* ============================================================
   ROUTER
   ============================================================ */
if (typeof mqtt === "undefined") {
  app.innerHTML = `<main><header><div class="wordmark">Missing file<span class="dot">.</span></div></header>
    <p style="color:var(--muted)">Upload <code>mqtt.min.js</code> into the same folder as this page, then reload.</p></main>`;
} else if (ROLE === "setup" || !ROOM) renderSetup();
else if (ROLE === "send") renderTeacher();
else renderScreen();
</script>
</body>
</html>
